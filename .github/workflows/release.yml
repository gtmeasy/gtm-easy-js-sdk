name: release

on:
  push:
    branches: [main]
    tags: ['v*']

# A second push to main while a release run is still publishing would race
# the npm registry; serialize per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      # Tag release: e.g. tag `v0.1.1` must match package.json "version": "0.1.1".
      # Publishes with `--tag latest` so `npm i @gtmeasy/growth` installs it.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (v$TAG_VERSION) does not match package.json version $PKG_VERSION. Bump package.json before tagging."
            exit 1
          fi
          echo "Publishing @gtmeasy/growth@$PKG_VERSION to npm (latest)"
          npm publish --access public --provenance --tag latest

      # Main-branch release: `0.1.1-<shortsha>-unstable`. Publishes with
      # `--tag unstable` so it doesn't move the default `latest` pointer.
      # Consumers opt in with `npm i @gtmeasy/growth@unstable`.
      - name: Publish unstable prerelease
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./package.json').version")
          # SemVer disallows `+` in the published version (npm strips build
          # metadata) and disallows non-alphanum dots inside prerelease ids,
          # so use `-<shortsha>-unstable` instead of `+sha.<shortsha>`.
          SHORT_SHA="${GITHUB_SHA:0:7}"
          UNSTABLE_VERSION="${BASE_VERSION}-${SHORT_SHA}-unstable"
          echo "Publishing @gtmeasy/growth@$UNSTABLE_VERSION to npm (unstable)"
          npm --no-git-tag-version version "$UNSTABLE_VERSION"
          npm publish --access public --provenance --tag unstable
